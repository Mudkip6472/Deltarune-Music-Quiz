<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Deltarune Music Quiz – Match</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0d0d1a;
    --bg2: #141428;
    --bg3: #1a1a35;
    --card: #1e1e3a;
    --border: #3a3a6a;
    --accent: #7c5cbf;
    --accent2: #a07ee0;
    --gold: #f5c842;
    --red: #e05050;
    --green: #50c87a;
    --text: #e8e6f0;
    --muted: #8888aa;
    --pixel: 'Press Start 2P', monospace;
    --body: 'Nunito', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 22% 65%, rgba(255,255,255,0.25) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 48% 28%, rgba(255,255,255,0.35) 0%, transparent 100%),
      radial-gradient(1px 1px at 63% 82%, rgba(255,255,255,0.25) 0%, transparent 100%),
      radial-gradient(1px 1px at 78% 18%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 88% 52%, rgba(255,255,255,0.35) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 88%, rgba(255,255,255,0.25) 0%, transparent 100%),
      radial-gradient(1px 1px at 3% 78%, rgba(255,255,255,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .game-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
    padding: 28px 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ── SCOREBOARD ── */
  .scoreboard {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }
  .player-card {
    flex: 1;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color 0.3s;
  }
  .player-card.me { border-color: var(--accent); }
  .player-card.scoring { animation: scorepop 0.4s ease; border-color: var(--gold) !important; }
  .player-name {
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-you { font-size: 10px; color: var(--accent2); font-weight: 700; }
  .player-score {
    font-family: var(--pixel);
    font-size: 26px;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(245,200,66,0.5);
    line-height: 1;
  }
  .score-pips {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }
  .pip {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s, transform 0.3s;
  }
  .pip.filled { background: var(--gold); transform: scale(1.15); }
  .vs-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--muted);
    padding: 0 4px;
    min-width: 28px;
  }

  /* ── ROUND PANEL ── */
  .round-panel {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    min-height: 260px;
    justify-content: center;
  }

  /* Idle state */
  .state-idle { text-align: center; }
  .state-idle .round-label {
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .state-idle .ready-info {
    font-size: 15px;
    color: var(--muted);
    font-weight: 600;
  }

  /* Countdown */
  .countdown-ring {
    width: 90px; height: 90px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .countdown-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .countdown-ring circle.track { fill: none; stroke: var(--border); stroke-width: 5; }
  .countdown-ring circle.fill {
    fill: none;
    stroke: var(--accent2);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 251.2;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.05s linear;
  }
  .countdown-num {
    font-family: var(--pixel);
    font-size: 28px;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(245,200,66,0.6);
    position: relative;
    z-index: 1;
  }

  /* Playing state */
  .waveform {
    display: flex;
    gap: 5px;
    align-items: flex-end;
    height: 48px;
  }
  .bar {
    width: 7px;
    background: var(--accent2);
    border-radius: 3px;
    animation: wavebar 0.5s ease-in-out infinite alternate;
    transition: background 0.2s;
  }
  .bar:nth-child(1) { animation-delay: 0s;    height: 60%; }
  .bar:nth-child(2) { animation-delay: 0.1s;  height: 90%; }
  .bar:nth-child(3) { animation-delay: 0.2s;  height: 45%; }
  .bar:nth-child(4) { animation-delay: 0.07s; height: 75%; }
  .bar:nth-child(5) { animation-delay: 0.15s; height: 55%; }
  .bar:nth-child(6) { animation-delay: 0.25s; height: 85%; }
  .bar:nth-child(7) { animation-delay: 0.05s; height: 40%; }
  .bar:nth-child(8) { animation-delay: 0.18s; height: 70%; }
  @keyframes wavebar { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }

  .playing-label {
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--accent2);
    letter-spacing: 2px;
    text-align: center;
  }

  /* Answer area */
  .answer-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .answer-input {
    width: 100%;
    background: var(--bg2);
    border: 2px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--body);
    font-size: 17px;
    font-weight: 700;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
  }
  .answer-input:focus { border-color: var(--accent2); }
  .answer-input::placeholder { color: var(--muted); font-weight: 600; }
  .answer-input.correct { border-color: var(--green); background: rgba(80,200,122,0.08); }
  .answer-input.wrong { border-color: var(--red); }
  .submit-btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: var(--pixel);
    font-size: 9px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
    box-shadow: 0 4px 16px rgba(124,92,191,0.35);
  }
  .submit-btn:hover { background: var(--accent2); transform: translateY(-1px); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Result state */
  .result-banner {
    font-family: var(--pixel);
    font-size: 11px;
    padding: 12px 20px;
    border-radius: 8px;
    text-align: center;
    letter-spacing: 1px;
  }
  .result-banner.correct { background: rgba(80,200,122,0.15); border: 1px solid var(--green); color: var(--green); }
  .result-banner.wrong   { background: rgba(160,126,224,0.12); border: 1px solid var(--border); color: var(--muted); }
  .result-banner.opponent-got { background: rgba(224,80,80,0.1); border: 1px solid var(--red); color: var(--red); }
  .correct-answer-reveal {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    text-align: center;
  }
  .correct-answer-reveal span { color: var(--gold); }
  .next-btn {
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: var(--pixel);
    font-size: 9px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .next-btn:hover { background: var(--accent2); }
  .host-only-label { font-size: 12px; color: var(--muted); font-weight: 600; }

  /* Win screen */
  .win-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    text-align: center;
    padding: 10px 0;
  }
  .win-screen.show { display: flex; }
  .win-title {
    font-family: var(--pixel);
    font-size: 14px;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(245,200,66,0.7);
    line-height: 1.8;
  }
  .win-subtitle { font-size: 16px; color: var(--muted); font-weight: 700; }
  .win-final-scores {
    display: flex;
    gap: 24px;
    font-size: 15px;
    font-weight: 800;
  }
  .home-btn {
    padding: 14px 32px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: var(--pixel);
    font-size: 9px;
    cursor: pointer;
    letter-spacing: 1px;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 4px 18px rgba(124,92,191,0.4);
    transition: all 0.15s;
    margin-top: 8px;
  }
  .home-btn:hover { background: var(--accent2); transform: translateY(-1px); }

  .stars-anim {
    font-size: 32px;
    letter-spacing: 8px;
    animation: starspop 0.6s ease both;
  }
  @keyframes starspop { from { opacity:0; transform: scale(0.5); } to { opacity:1; transform: scale(1); } }
  @keyframes scorepop { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }

  /* Loading / connecting */
  .connecting-msg {
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
    letter-spacing: 1px;
  }
  .pulse-dot {
    width: 8px; height: 8px;
    background: var(--accent2);
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
    display: inline-block;
    margin-right: 6px;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }

  /* Opponent status */
  .opponent-status {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    text-align: center;
  }
  .opponent-status .dot { color: var(--accent2); }

  /* Round counter */
  .round-counter {
    font-family: var(--pixel);
    font-size: 8px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 1px;
  }

  /* Answer reveal waveform (smaller, gold) */
  .reveal-waveform {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 32px;
    margin-top: 4px;
  }
  .reveal-waveform .bar {
    width: 5px;
    background: var(--gold);
    border-radius: 3px;
    animation: wavebar 0.6s ease-in-out infinite alternate;
  }
</style>
</head>

<div class="game-wrap">
  <div id="connecting" class="connecting-msg"><span class="pulse-dot"></span> CONNECTING...</div>

  <!-- Scoreboard -->
  <div class="scoreboard" id="scoreboard" style="display:none">
    <div class="player-card me" id="card-me">
      <div class="player-name" id="name-me">—</div>
      <div class="player-you">YOU</div>
      <div class="player-score" id="score-me">0</div>
      <div class="score-pips" id="pips-me"></div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="player-card" id="card-opp">
      <div class="player-name" id="name-opp">—</div>
      <div class="player-you" style="visibility:hidden">OPP</div>
      <div class="player-score" id="score-opp">0</div>
      <div class="score-pips" id="pips-opp"></div>
    </div>
  </div>

  <div class="round-counter" id="round-counter" style="display:none"></div>

  <!-- Main game panel -->
  <div class="round-panel" id="round-panel" style="display:none">
    <div class="connecting-msg" id="state-loading"><span class="pulse-dot"></span> LOADING ROUND...</div>

    <!-- Idle: waiting for host to start next round -->
    <div id="state-idle" style="display:none">
      <div class="state-idle">
        <div class="round-label" id="idle-label">GET READY</div>
        <div class="ready-info" id="idle-info">Waiting for next round...</div>
      </div>
    </div>

    <!-- Countdown -->
    <div id="state-countdown" style="display:none; flex-direction:column; align-items:center; gap:14px;">
      <div class="playing-label">LISTEN CAREFULLY...</div>
      <div class="countdown-ring">
        <svg viewBox="0 0 90 90" width="90" height="90">
          <circle class="track" cx="45" cy="45" r="40"/>
          <circle class="fill" id="countdown-circle" cx="45" cy="45" r="40"/>
        </svg>
        <div class="countdown-num" id="countdown-num">3</div>
      </div>
    </div>

    <!-- Playing -->
    <div id="state-playing" style="display:none; flex-direction:column; align-items:center; gap:14px;">
      <div class="playing-label">♪ NOW PLAYING...</div>
      <div class="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
      <div class="answer-area">
        <input class="answer-input" id="answer-input" type="text" placeholder="Type the song title..." autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="submit-btn" id="submit-btn" onclick="submitAnswer()">Submit Answer</button>
      </div>
    </div>

    <!-- Result -->
    <div id="state-result" style="display:none; flex-direction:column; align-items:center; gap:16px; width:100%;">
      <div class="result-banner" id="result-banner">—</div>
      <div class="correct-answer-reveal" id="correct-reveal"></div>
      <!-- Answer reveal waveform shown while song plays back -->
      <div class="reveal-waveform" id="reveal-waveform" style="display:none;">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div class="opponent-status" id="opp-status"></div>
      <div id="next-controls" style="display:none; flex-direction:column; align-items:center; gap:8px;">
        <button class="next-btn" onclick="hostNextRound()">Next Round ▶</button>
        <div class="host-only-label">You're the host — click to continue</div>
      </div>
      <div id="guest-waiting" style="display:none;">
        <div class="opponent-status"><span class="pulse-dot"></span> Waiting for host to start next round...</div>
      </div>
    </div>
  </div>

  <!-- Win screen -->
  <div class="round-panel win-screen" id="win-screen">
    <div class="stars-anim">★ ★ ★</div>
    <div class="win-title" id="win-title">—</div>
    <div class="win-subtitle" id="win-subtitle"></div>
    <div class="win-final-scores" id="win-scores"></div>
    <a href="index.html" class="home-btn">↩ Return Home</a>
  </div>
</div>

  const WIN_SCORE = 5;
  const AUDIO_DIR = "audio/";
  const CLIP_DURATION_MS = 8000;   // how long the clip plays during the round
  const REVEAL_DURATION_MS = 7500; // how long the song plays on answer reveal

  // Parse URL params
  const params = new URLSearchParams(window.location.search);
  const GAME_CODE = params.get('code');
  const PLAYER_ROLE = params.get('player');
  const MY_NAME = decodeURIComponent(params.get('name') || 'Player');
  const IS_HOST = PLAYER_ROLE === 'host';

  if (!GAME_CODE) { window.location.href = 'index.html'; }

  // Fuse for fuzzy matching
  const fuse = new Fuse(TRACKS, {
    keys: ['title'],
    threshold: 0.35,
    includeScore: true
  });

  // Audio
  const audio = new Audio();
  let currentTrackTitle = '';
  let currentTrackFile = '';
  let currentTrackStartSec = 0;
  let hasAnsweredThisRound = false;
  let roundWon = false;
  let gameOver = false;
  let usedTracks = [];
  let revealTimeout = null;

  // ── STATE TRANSITIONS ────────────────────────────────────────────────────
  function showState(id) {
    const states = ['state-loading','state-idle','state-countdown','state-playing','state-result'];
    states.forEach(s => {
      const el = document.getElementById(s);
      if (el) el.style.display = 'none';
    });
    const el = document.getElementById(id);
    if (el) el.style.display = 'flex';
    if (id === 'state-playing') {
      el.style.flexDirection = 'column';
      el.style.alignItems = 'center';
      document.getElementById('answer-input').focus();
    }
  }

  // ── PIPS ─────────────────────────────────────────────────────────────────
  function renderPips(elId, score) {
    const el = document.getElementById(elId);
    el.innerHTML = '';
    for (let i = 0; i < WIN_SCORE; i++) {
      const pip = document.createElement('div');
      pip.className = 'pip' + (i < score ? ' filled' : '');
      el.appendChild(pip);
    }
  }

  // ── PICK RANDOM TRACK ─────────────────────────────────────────────────────
  function pickRandomTrack() {
    const available = TRACKS.filter(t => !usedTracks.includes(t.file));
    if (available.length === 0) { usedTracks = []; return TRACKS[Math.floor(Math.random()*TRACKS.length)]; }
    return available[Math.floor(Math.random()*available.length)];
  }

  // ── PLAY AUDIO CLIP (plays once for CLIP_DURATION_MS) ────────────────────
  function playClip(file, startSec) {
    return new Promise(resolve => {
      audio.pause();
      audio.src = AUDIO_DIR + file;

      const onReady = () => {
        audio.currentTime = startSec;
        audio.play().catch(err => console.error('Audio play error:', err));
        setTimeout(() => {
          audio.pause();
          resolve();
        }, CLIP_DURATION_MS);
      };

      if (audio.readyState >= 2) {
        onReady();
      } else {
        audio.addEventListener('canplay', onReady, { once: true });
        audio.addEventListener('error', () => {
          console.error('Audio load error:', file);
          resolve(); // don't hang the game
        }, { once: true });
      }
    });
  }

  // ── PLAY REVEAL (plays the song for REVEAL_DURATION_MS then stops) ────────
  function playReveal(file, startSec) {
    if (revealTimeout) clearTimeout(revealTimeout);
    audio.pause();
    audio.src = AUDIO_DIR + file;

    const onReady = () => {
      audio.currentTime = startSec;
      audio.play().catch(() => {});
      document.getElementById('reveal-waveform').style.display = 'flex';
      revealTimeout = setTimeout(() => {
        audio.pause();
        document.getElementById('reveal-waveform').style.display = 'none';
      }, REVEAL_DURATION_MS);
    };

    if (audio.readyState >= 2) {
      onReady();
    } else {
      audio.addEventListener('canplay', onReady, { once: true });
    }
  }

  // ── COUNTDOWN ─────────────────────────────────────────────────────────────
  function runCountdown() {
    return new Promise(resolve => {
      showState('state-countdown');
      const circle = document.getElementById('countdown-circle');
      const numEl = document.getElementById('countdown-num');
      const circumference = 251.2;
      let n = 3;
      numEl.textContent = n;
      circle.style.strokeDashoffset = '0';
      const interval = setInterval(() => {
        n--;
        if (n <= 0) {
          clearInterval(interval);
          numEl.textContent = '♪';
          circle.style.strokeDashoffset = circumference + '';
          resolve();
        } else {
          numEl.textContent = n;
          circle.style.strokeDashoffset = (circumference * (1 - n/3)) + '';
        }
      }, 1000);
    });
  }

  // ── FUZZY MATCH CHECK ─────────────────────────────────────────────────────
  function isCorrect(guess, target) {
    if (guess.trim().toLowerCase() === target.toLowerCase()) return true;
    const results = fuse.search(guess);
    if (results.length > 0 && results[0].score < 0.35) {
      return results[0].item.title.toLowerCase() === target.toLowerCase();
    }
    return false;
  }

  // ── SUBMIT ANSWER ─────────────────────────────────────────────────────────
  window.submitAnswer = async function() {
    if (hasAnsweredThisRound || gameOver) return;
    const guess = document.getElementById('answer-input').value.trim();
    if (!guess) return;

    hasAnsweredThisRound = true;
    document.getElementById('submit-btn').disabled = true;

    const correct = isCorrect(guess, currentTrackTitle);

    if (correct) {
      document.getElementById('answer-input').classList.add('correct');
      const snap = await get(ref(db, 'games/' + GAME_CODE));
      const data = snap.val();
      const myScoreKey = IS_HOST ? 'hostScore' : 'guestScore';
      const newScore = (data[myScoreKey] || 0) + 1;
      const updates = { [myScoreKey]: newScore };
      updates[IS_HOST ? 'hostAnswered' : 'guestAnswered'] = 'correct';
      // Also lock out opponent immediately
      updates[IS_HOST ? 'guestAnswered' : 'hostAnswered'] = data[IS_HOST ? 'guestAnswered' : 'hostAnswered'] || 'locked';
      await update(ref(db, 'games/' + GAME_CODE), updates);
    } else {
      document.getElementById('answer-input').classList.add('wrong');
      const updates = {};
      updates[IS_HOST ? 'hostAnswered' : 'guestAnswered'] = 'wrong';
      await update(ref(db, 'games/' + GAME_CODE), updates);
    }
  };

  // Enter key to submit
  document.getElementById('answer-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.submitAnswer();
  });

  // ── HOST: START NEXT ROUND ─────────────────────────────────────────────────
  window.hostNextRound = async function() {
    // Stop any reveal playback
    if (revealTimeout) clearTimeout(revealTimeout);
    audio.pause();
    document.getElementById('reveal-waveform').style.display = 'none';

    const snap = await get(ref(db, 'games/' + GAME_CODE));
    const data = snap.val();
    if (!data) return;

    if ((data.hostScore >= WIN_SCORE) || (data.guestScore >= WIN_SCORE)) return;

    const track = pickRandomTrack();
    usedTracks.push(track.file);
    const startSec = Math.floor(Math.random() * 25);
    const round = (data.currentRound || 0) + 1;

    await update(ref(db, 'games/' + GAME_CODE), {
      status: 'countdown',
      currentRound: round,
      hostAnswered: null,
      guestAnswered: null,
      roundData: {
        file: track.file,
        title: track.title,
        startSec: startSec,
        startedAt: Date.now()
      }
    });
  };

  // ── SHOW RESULT ──────────────────────────────────────────────────────────
  function showResult(data) {
    showState('state-result');
    const myAnswered = IS_HOST ? data.hostAnswered : data.guestAnswered;
    const oppAnswered = IS_HOST ? data.guestAnswered : data.hostAnswered;

    const banner = document.getElementById('result-banner');
    const reveal = document.getElementById('correct-reveal');
    const oppStatus = document.getElementById('opp-status');

    if (myAnswered === 'correct') {
      banner.textContent = '✓ CORRECT! +1 POINT';
      banner.className = 'result-banner correct';
    } else if (oppAnswered === 'correct') {
      banner.textContent = '✗ OPPONENT GOT IT';
      banner.className = 'result-banner opponent-got';
    } else {
      banner.textContent = 'NO ONE GOT IT';
      banner.className = 'result-banner wrong';
    }

    reveal.innerHTML = `Answer: <span>${data.roundData?.title || ''}</span>`;

    // Play the reveal
    if (data.roundData?.file) {
      playReveal(data.roundData.file, data.roundData.startSec || 0);
    }

    if (oppAnswered && oppAnswered !== 'locked') {
      const oppName = IS_HOST ? data.guest : data.host;
      oppStatus.textContent = oppAnswered === 'correct' ? `${oppName} got it right!` : `${oppName} got it wrong.`;
    } else if (!oppAnswered) {
      oppStatus.innerHTML = `<span class="pulse-dot"></span> Waiting for opponent...`;
    } else {
      oppStatus.textContent = '';
    }

    const nextCtrl = document.getElementById('next-controls');
    const guestWait = document.getElementById('guest-waiting');
    if (IS_HOST) {
      if ((data.hostScore >= WIN_SCORE) || (data.guestScore >= WIN_SCORE)) {
        nextCtrl.style.display = 'none';
        guestWait.style.display = 'none';
      } else {
        nextCtrl.style.display = 'flex';
        guestWait.style.display = 'none';
      }
    } else {
      nextCtrl.style.display = 'none';
      guestWait.style.display = 'block';
    }
  }

  // ── SHOW WIN SCREEN ───────────────────────────────────────────────────────
  function showWinScreen(data) {
    gameOver = true;
    if (revealTimeout) clearTimeout(revealTimeout);
    audio.pause();
    document.getElementById('scoreboard').style.display = 'none';
    document.getElementById('round-panel').style.display = 'none';
    document.getElementById('round-counter').style.display = 'none';

    const win = document.getElementById('win-screen');
    win.classList.add('show');

    const myScore = IS_HOST ? data.hostScore : data.guestScore;
    const oppScore = IS_HOST ? data.guestScore : data.hostScore;
    const myName = IS_HOST ? data.host : data.guest;
    const oppName = IS_HOST ? data.guest : data.host;
    const iWon = myScore >= WIN_SCORE;

    document.getElementById('win-title').textContent = iWon ? '★ YOU WIN! ★' : `${oppName} WINS!`;
    if (!iWon) document.getElementById('win-title').style.color = 'var(--muted)';
    document.getElementById('win-subtitle').textContent = iWon ? 'Deltarune music expert! 🎵' : 'Better luck next time...';
    document.getElementById('win-scores').innerHTML =
      `<span style="color:var(--accent2)">${myName}: ${myScore}</span> &nbsp;|&nbsp; <span style="color:var(--muted)">${oppName}: ${oppScore}</span>`;
  }

  // ── MAIN GAME LISTENER ────────────────────────────────────────────────────
  let lastRoundStartedAt = null;
  let playingRound = false;

  onValue(ref(db, 'games/' + GAME_CODE), async (snap) => {
    if (!snap.exists()) { window.location.href = 'index.html'; return; }
    const data = snap.val();

    if (gameOver) return;

    document.getElementById('connecting').style.display = 'none';
    document.getElementById('scoreboard').style.display = 'flex';
    document.getElementById('round-panel').style.display = 'flex';
    document.getElementById('round-counter').style.display = 'block';

    const myName = IS_HOST ? data.host : data.guest;
    const oppName = IS_HOST ? data.guest : data.host;
    document.getElementById('name-me').textContent = myName || '—';
    document.getElementById('name-opp').textContent = oppName || '—';

    const myScore = IS_HOST ? data.hostScore : data.guestScore;
    const oppScore = IS_HOST ? data.guestScore : data.hostScore;
    document.getElementById('score-me').textContent = myScore;
    document.getElementById('score-opp').textContent = oppScore;
    renderPips('pips-me', myScore);
    renderPips('pips-opp', oppScore);
    document.getElementById('round-counter').textContent = `ROUND ${data.currentRound || 0}`;

    // Score animation
    if (data.hostScore !== undefined) {
      const prevMyScore = parseInt(document.getElementById('score-me').dataset.prev || '0');
      if (myScore > prevMyScore) {
        document.getElementById('card-me').classList.add('scoring');
        setTimeout(() => document.getElementById('card-me').classList.remove('scoring'), 500);
      }
      document.getElementById('score-me').dataset.prev = myScore;
    }

    // Win check
    if (myScore >= WIN_SCORE || oppScore >= WIN_SCORE) {
      showWinScreen(data);
      return;
    }

    // Game just started, no rounds yet
    if (data.status === 'playing' && !data.roundData) {
      if (IS_HOST) {
        showState('state-idle');
        document.getElementById('idle-label').textContent = 'GAME STARTED!';
        document.getElementById('idle-info').innerHTML = '<button class="next-btn" style="margin-top:12px" onclick="hostNextRound()">Start First Round ▶</button>';
      } else {
        showState('state-idle');
        document.getElementById('idle-label').textContent = 'CONNECTED!';
        document.getElementById('idle-info').textContent = 'Waiting for host to start...';
      }
      return;
    }

    if (data.status === 'countdown') {
      const roundStartedAt = data.roundData?.startedAt;

      // New round detected — only trigger once per unique round
      if (!playingRound && roundStartedAt && roundStartedAt !== lastRoundStartedAt) {
        lastRoundStartedAt = roundStartedAt;
        playingRound = true;
        hasAnsweredThisRound = false;
        roundWon = false;
        currentTrackTitle = data.roundData?.title || '';
        currentTrackFile = data.roundData?.file || '';
        currentTrackStartSec = data.roundData?.startSec || 0;

        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').classList.remove('correct','wrong');
        document.getElementById('submit-btn').disabled = false;
        document.getElementById('reveal-waveform').style.display = 'none';

        try {
          await runCountdown();
          showState('state-playing');
          await playClip(currentTrackFile, currentTrackStartSec);
        } finally {
          playingRound = false;
        }
        return;
      }

      // Check if someone already answered (lock out or show result)
      const hostDone = data.hostAnswered !== null && data.hostAnswered !== undefined;
      const guestDone = data.guestAnswered !== null && data.guestAnswered !== undefined;

      // If opponent got it correct, lock out immediately
      const oppAnswered = IS_HOST ? data.guestAnswered : data.hostAnswered;
      if (oppAnswered === 'correct' && !hasAnsweredThisRound) {
        hasAnsweredThisRound = true;
        document.getElementById('submit-btn').disabled = true;
      }

      if (hostDone && guestDone) {
        showResult(data);
      } else {
        const myAnswered = IS_HOST ? data.hostAnswered : data.guestAnswered;
        if (myAnswered) {
          showResult(data);
        }
      }
    }
  });
</script>
</body>
</html>
